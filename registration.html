<!DOCTYPE html>
<html>
<head>
    <title>Registration - Canteen Queue Management System</title>
</head>
<body>
    <h1 align="center">🍽 Canteen Queue Management System</h1>
    <hr>
    <h2 align="center">Student Registration</h2>
    <form align="center" action="login.html" method="post">
        <label>Full Name</label><br>
        <input type="text" placeholder="Enter Full Name" required>
        <br><br>
        <label>Student ID</label><br>
        <input type="text" placeholder="Enter Student ID" required>
        <br><br>
        <label>Email</label><br>
        <input type="email" placeholder="Enter Email" required>
        <br><br>
        <label>Phone Number</label><br>
        <input type="tel" placeholder="Enter Phone Number" required>
        <br><br>
        <label>Password</label><br>
        <input type="password" placeholder="Create Password" required>
        <br><br>
        <label>Confirm Password</label><br>
        <input type="password" placeholder="Confirm Password" required>
        <br><br>
        <input type="submit" value="Register">
        <br><br>
        <a href="login.html">Already have an account? Login</a>
        <br><br>
        <a href="index.html">Back to Home</a>
    </form>
    <hr>
    <p align="center">
        &copy; 2026 Canteen Queue Management System
    </p>
</body>
</html>
